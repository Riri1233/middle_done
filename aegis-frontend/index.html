<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Comply — RegTech Platform</title>
    <meta name="description" content="AI-платформа двойного комплаенса для ВЭД. Санкционный скрининг, экспортный контроль, UBO-анализ." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 14px; }
      body { background: #07080F; color: #E1E4EE; font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1E2535; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #2A3450; }
      input, select, textarea, button { font-family: 'Outfit', sans-serif; }
      * { transition: background-color 0.15s, border-color 0.15s, opacity 0.15s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
